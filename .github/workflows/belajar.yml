name : Validasi Fullstact Laravel Vue

on: 
  pull_request:
    branches:
      - main
jobs : 

  web-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.0
        env: 
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with: 
          node-version: '24'

      - name: Install Dependesi PHP dan JS (COMPOSER DAN NPM)
        run: |
          composer install --no-progress --prefer-dist
          npm ci
      
      - name: Memastika code vue dan typescript dapat di compile
        run: npm run build
      
      - name: Menjalankan PHP Unit Test
        env: 
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: larvel_test
          DB_USERNAME: root
          DB_PASSWORD: root

        run : | 
          cp .env.example .env
          php artisan key:generate
          php artisan migrate
          php artisan test
  
